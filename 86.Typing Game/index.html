<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Challenge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Typing Challenge</h1>
      <div class="main" id="main">Click START to begin typing...</div>
      <textarea
        id="typingArea"
        class="typingArea"
        placeholder="Start typing here..."
        disabled
      ></textarea>
      <button class="btn" id="btn">START</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
