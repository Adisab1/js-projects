<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy and Move Text</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="btns-container">
        <button class="copyBtn btn">Copy Text</button>
      </div>
      <textarea
        name="copyTxt"
        cols="50"
        rows="10"
        placeholder="Type something here..."
      >
Hello Aditya</textarea
      >
    </div>
    <div class="output-container">
      <div class="output">
        <button class="moveBtn btn">Move Text</button>

        <textarea
          name="finalTxt"
          cols="50"
          rows="10"
          placeholder="Move text will appear here..."
        ></textarea>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
