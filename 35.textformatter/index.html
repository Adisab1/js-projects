<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic text formatter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="input-container">
        <h2>Type in Your Text</h2>
        <input type="text" id="input-field" placeholder="Type something..." />
      </div>

      <div class="btns-container">
        <button class="btn uppercase">ABC</button>
        <button class="btn lowercase">abc</button>
        <button class="btn capitalize">Abc</button>
        <button class="btn italic">/</button>
        <button class="btn bold">B</button>
        <button class="btn underline">underline</button>
      </div>
      <p id="output-field">Output</p>
    </div>
    <script src="index.js"></script>
  </body>
</html>
