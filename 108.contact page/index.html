<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Page</title>

    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Inter:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <section class="info-section">
        <div class="info-content">
          <span class="badge">Contact </span>
          <h1>Contact Us. Lets work together!</h1>

          <p>
            We'd love to hear from you! Get in touch with us and let's discuss
            how we can help you achieve your goals.
          </p>

          <div class="contact-cards">
            <div class="contact-card">
              <div class="card-icon">
                <i class="fa-solid fa-envolope"></i>
              </div>
              <div class="card-info">
                <span class="card-label">Email</span>
                <a href="mailto:adi@gmail.com">adi@gmail.com</a>
              </div>
            </div>
            <div class="contact-card">
              <div class="card-icon">
                <i class="fa-solid fa-phone"></i>
              </div>
              <div class="card-info">
                <span class="card-label">Phone</span>
                <a href="tel:+1234567890">+1 (234) 567-890</a>
              </div>
            </div>
            <div class="contact-card">
              <div class="card-icon">
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <div class="card-info">
                <span class="card-label"> Office Address</span>
                <p>123 Main Street, City, State 12345</p>
              </div>
            </div>
          </div>

          <div class="socials">
            <a
              href="https://www.facebook.com"
              target="_blank"
              class="social-link"
            >
              <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a
              href="https://www.twitter.com"
              target="_blank"
              class="social-link"
            >
              <i class="fa-brands fa-twitter"></i>
            </a>
            <a
              href="https://www.instagram.com"
              target="_blank"
              class="social-link"
            >
              <i class="fa-brands fa-instagram"></i>
            </a>
            <a
              href="https://www.linkedin.com"
              target="_blank"
              class="social-link"
            >
              <i class="fa-brands fa-linkedin-in"></i>
            </a>
          </div>
        </div>
      </section>

      <section class="form-section">
        <form class="contact-form" id="contact-form">
          <h2>Send us a message</h2>
          <div class="form-row">
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first-name" required />
            </div>

            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last-name" required />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <select id="subject" required>
              <option value="" disabled selected>Select a subject</option>
              <option value="general">General Inquiry</option>
              <option value="support">Support Request</option>
              <option value="feedback">Feedback</option>
            </select>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>
  </body>
</html>
