<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random User Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="img-area">
        <div class="inner-area">
          <img id="img" src="img8.jpg" alt="User Image" />
        </div>
      </div>
      <div id="name">John Doe</div>
      <hr class="horizon" />
      <div class="info">
        <p>First Name: <span id="first">John</span></p>
        <p>Last Name: <span id="last">Doe</span></p>
        <p>Location: <span id="location">New York</span></p>
        <p>Phone: <span id="phone">(123) 456-7890</span></p>
        <p>Email: <span id="email">john.doe@example.com</span></p>
      </div>
      <button id="btn">Random User</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
