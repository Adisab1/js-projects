<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="container">
      <h2 class="title">Word Counter</h2>
      <textarea class="text-input" placeholder="Type text here"> </textarea>
    </section>

    <section>
      <strong> Word Count:</strong>
      <span class="word-count">0</span>
    </section>
    <section>
      <strong> Letter Count:</strong>
      <span class="letter-count">0</span>
    </section>
    <section>
      <strong> Number of Spaces:</strong>
      <span class="space-count">0</span>
    </section>
    <script src="app.js"></script>
  </body>
</html>
