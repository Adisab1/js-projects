<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Menu Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
      <div class="selector">
        <div id="selectField">
            <p id="selectText">Select a social media platform</p>
<img  src="images/arrow.png" alt="Select Icon" id="arrowIcon">

        </div>
        <ul id="list" class="hide">
<li class="options">
    <img src="images/facebook.png" alt="Facebook Icon">
    <p>Facebook</p>

</li>
<li class="options">   
    <img src="images/twitter.png" alt="Twitter Icon">
    <p>Twitter</p>
</li>
<li class="options">
    <img src="images/instagram.png" alt="Instagram Icon">
    <p>Instagram</p>
</li>   
<li class="options">
<img src="images/whatsapp.png" alt="WhatsApp Icon">
    <p>WhatsApp</p>
</li>   

<li class="options">
    <img src="images/youtube.png" alt="YouTube Icon">
    <p>YouTube</p>
</li>
<li class="options">
    <img src="images/pinterest.png" alt="Pinterest Icon">
    <p>Pinterest</p>
</li>
        </ul>
      </div>


    <script src="index.js"></script>
</body>
</html>
