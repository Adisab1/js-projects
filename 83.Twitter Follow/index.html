<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter Follow Control Panel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button class="themer">Dark</button>
    <div class="card">
      <h1 class="card-title">Who to Follow</h1>
      <span class="divider"></span>
      <div class="profile">
        <div class="profile-pic img-one"></div>
        <div class="profile-info">
          <span class="display-name">John Doe</span>
          <span class="username">@johndoe</span>
        </div>
        <button class="follow-button followed">Unfollow</button>
      </div>
      <span class="divider"></span>
      <div class="profile">
        <div class="profile-pic img-two"></div>
        <div class="profile-info">
          <span class="display-name">Johny Kalifa</span>
          <span class="username">@johnykalifa</span>
        </div>
        <button class="follow-button">Follow</button>
      </div>
      <span class="divider"></span>
      <div class="profile">
        <div class="profile-pic img-three"></div>
        <div class="profile-info">
          <span class="display-name">Aleberta </span>
          <span class="username">@aleberta</span>
        </div>
        <button class="follow-button">Follow</button>
      </div>
      <a href="" class="show-more">Show more</a>
    </div>
    <script src="app.js"></script>
  </body>
</html>
